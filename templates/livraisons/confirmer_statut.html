{% extends 'base_auth.html' %}
{% block title %}Confirmer — AgriMarché{% endblock %}

{% block content %}
<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg-soft); padding:var(--sp-5);">
  <div style="background:var(--white); border-radius:var(--r-lg); padding:var(--sp-8); max-width:440px; width:100%; text-align:center; box-shadow:var(--shadow-lg);">
    <div style="font-size:56px; margin-bottom:var(--sp-4);">🚚</div>
    <h2 style="font-size:22px; margin-bottom:var(--sp-3);">Confirmer le changement de statut ?</h2>
    <p style="color:var(--ink-soft); margin-bottom:var(--sp-6);">
      La livraison #{{ livraison.pk }} passera au statut <strong>{{ nouveau_statut }}</strong>.
    </p>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <button type="submit" class="btn btn-lemon btn-block btn-lg">Confirmer</button>
      <a href="{% url 'detail_livraison' livraison.pk %}" class="btn btn-ghost btn-block" style="margin-top:var(--sp-3);">Annuler</a>
    </form>
  </div>
</div>
{% endblock %}
